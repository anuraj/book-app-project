name: Pull Request Tests

on:
  pull_request:
  schedule:
    - cron: '0 0 * * 1-5'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Books.slnx --nologo

      - name: Run unit tests
        run: dotnet test Books.slnx --nologo --no-restore /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total
